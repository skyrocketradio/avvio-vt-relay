services:
  relay:
    build: .
    restart: unless-stopped
    pull_policy: build
    # Expose the container port for xCloud's per-site Nginx reverse proxy — do NOT
    # publish a fixed host port (that collides with other sites on a shared server).
    expose:
      - "8080"
    environment:
      # REQUIRED: high-entropy shared secret; the desktop sends it as a bearer token.
      AVVIO_VT_STATION_KEY: "${AVVIO_VT_STATION_KEY:?set a strong station key}"
      AVVIO_VT_EXPIRY_DAYS: "14"
    volumes:
      - vtdata:/data

volumes:
  vtdata:
